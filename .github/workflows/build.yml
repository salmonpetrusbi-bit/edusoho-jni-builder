name: Build EduSoho Llama.cpp JNI (arm64-v8a)

on:
  workflow_dispatch:
  push:

jobs:
  build-native-so:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Clone Resmi llama.cpp ke folder llama.cpp
        run: |
          rm -rf llama.cpp
          git clone --depth 1 --branch b4600 https://github.com/ggerganov/llama.cpp.git llama.cpp

      - name: 3. Setup Android NDK r26d & CMake
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          add-to-path: true

      - name: 4. Kompilasi CMake untuk arm64-v8a
        run: |
          mkdir -p build-arm64
          cmake -S . -B build-arm64 \
            -DCMAKE_TOOLCHAIN_FILE="${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DGGML_OPENMP=OFF

          cmake --build build-arm64 --config Release -j$(nproc)

      - name: 5. Kumpulkan Semua File .so ke jniLibs/arm64-v8a
        run: |
          mkdir -p dist/jniLibs/arm64-v8a
          find build-arm64 -name "*.so" -exec cp {} dist/jniLibs/arm64-v8a/ \;
          
          LIBCPP_PATH=$(find "${{ steps.setup-ndk.outputs.ndk-path }}" -name "libc++_shared.so" | grep "aarch64-linux-android" | head -n 1)
          if [ -n "$LIBCPP_PATH" ]; then
            cp "$LIBCPP_PATH" dist/jniLibs/arm64-v8a/
          fi

          STRIP_TOOL=$(find "${{ steps.setup-ndk.outputs.ndk-path }}" -name "llvm-strip" | head -n 1)
          if [ -n "$STRIP_TOOL" ]; then
            "$STRIP_TOOL" --strip-unneeded dist/jniLibs/arm64-v8a/*.so || true
          fi

          ls -lh dist/jniLibs/arm64-v8a/

      - name: 6. Upload Artifact Prebuilt jniLibs (Siap Unduh)
        uses: actions/upload-artifact@v4
        with:
          name: edusoho-llama-jniLibs-arm64-v8a
          path: dist/jniLibs/
          if-no-files-found: error
