name: Build EduSoho Llama.cpp JNI (arm64-v8a)

on:
  workflow_dispatch:
  push:

jobs:
  build-native-so:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Clone llama.cpp & Bersihkan Bendera -ffast-math di CMakeLists.txt
        run: |
          rm -rf llama.cpp
          git clone --depth 1 --branch b4600 https://github.com/ggerganov/llama.cpp.git llama.cpp
          
          # Hapus -ffast-math dari CMakeLists.txt karena menyebabkan ggml-cpu.c gagal dikompilasi di NDK Clang
          sed -i 's/-ffast-math//g' CMakeLists.txt
          
          # Pastikan pemanggilan clear KV cache sesuai dengan header llama.h
          if ! grep -q "llama_kv_self_clear" llama.cpp/include/llama.h; then
            sed -i 's/llama_kv_self_clear/llama_kv_cache_clear/g' llama_edusoho_jni.cpp
          fi

      - name: 3. Kompilasi CMake (arm64-v8a) dengan Standar Resmi Android llama.cpp
        run: |
          NDK_PATH="${ANDROID_NDK_LATEST_HOME:-$(ls -d $ANDROID_HOME/ndk/* | tail -n 1)}"
          echo "Menggunakan NDK: $NDK_PATH"
          mkdir -p build-arm64
          cmake -S . -B build-arm64 \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_PATH/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-march=armv8-a -Wno-error" \
            -DCMAKE_CXX_FLAGS="-march=armv8-a -Wno-error" \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            -DGGML_LLAMAFILE=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_CURL=OFF

          # Kompilasi dengan 1 thread jika gagal agar pesan error C tepat terlihat di baris paling bawah
          cmake --build build-arm64 --config Release -j$(nproc) || cmake --build build-arm64 --config Release -j1

      - name: 4. Kumpulkan Semua File .so ke jniLibs/arm64-v8a
        run: |
          NDK_PATH="${ANDROID_NDK_LATEST_HOME:-$(ls -d $ANDROID_HOME/ndk/* | tail -n 1)}"
          mkdir -p dist/jniLibs/arm64-v8a
          find build-arm64 -name "*.so" -exec cp {} dist/jniLibs/arm64-v8a/ \;
          
          LIBCPP_PATH=$(find "$NDK_PATH" -name "libc++_shared.so" | grep "aarch64-linux-android" | head -n 1)
          if [ -n "$LIBCPP_PATH" ]; then
            cp "$LIBCPP_PATH" dist/jniLibs/arm64-v8a/
          fi

          STRIP_TOOL=$(find "$NDK_PATH" -name "llvm-strip" | head -n 1)
          if [ -n "$STRIP_TOOL" ]; then
            "$STRIP_TOOL" --strip-unneeded dist/jniLibs/arm64-v8a/*.so || true
          fi

          ls -lh dist/jniLibs/arm64-v8a/

      - name: 5. Upload Artifact Prebuilt jniLibs
        uses: actions/upload-artifact@v4
        with:
          name: edusoho-llama-jniLibs-arm64-v8a
          path: dist/jniLibs/
          if-no-files-found: error
